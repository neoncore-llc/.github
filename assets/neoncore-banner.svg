<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0d1326"/>
      <stop offset="100%" stop-color="#090d1a"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>
  <circle cx="1020" cy="80" r="180" fill="url(#neonCyan)" opacity="0.08"/>
  <circle cx="180" cy="260" r="210" fill="url(#neonPurple)" opacity="0.08"/>
  <rect x="60" y="56" width="6" height="208" rx="3" fill="url(#neonCyan)"/>
  <text x="92" y="125" font-family=" -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#f8fafc" letter-spacing="1.5">
    NEONCORE <tspan fill="url(#neonCyan)">LLC</tspan>
  </text>
  <text x="92" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
    Tactical In-Game Overlays · Match Analytics · Cloud Profile Ecosystem
  </text>
  <g transform="translate(92, 212)">
    <rect x="0" y="0" width="190" height="38" rx="19" fill="#0f172a" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="95" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38bdf8">neoncore.llc</text>
    <rect x="208" y="0" width="230" height="38" rx="19" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="323" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#c084fc">Cloud Profiles &amp; Presets</text>
    <rect x="456" y="0" width="220" height="38" rx="19" fill="#0f172a" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="566" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#6ee7b7">24/7 Player Support</text>
